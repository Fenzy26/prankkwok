<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prank Wok</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .container img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
        }
        .container h1 {
            margin-top: 15px;
            color: #1e3c72;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="gambar/gambar.jpg" alt="Gambar Saya">
        <h1>Anak Pintar</h1>
    </div>
    
</body>
</html>
